[package]
name = "relay"
version = "0.1.0"
edition = "2021"

[dependencies]
# The relay is a plain tokio program: WS rooms + static hosting, nothing else.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
# Production has no TLS of its own (Caddy/nginx terminate it, see README);
# `handshake` only.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Auth is sha256 over bearer tokens; hashes are persisted, tokens never are.
sha2 = "0.10"
# 256-bit device/phone/pair tokens, pairing codes and per-phone conn ids.
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Integration tests connect as real clients (needs `connect`, TLS-free).
tokio-tungstenite = { version = "0.29", features = ["connect"] }
