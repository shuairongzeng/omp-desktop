<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <!-- OMP Desktop (Electron port) mark: 3+6 — an orbit of session tabs held
       inside terminal brackets. Brand: liquid mint #8AF0C8 / #2BD49A on the
       app's near-black shell. macOS squircle background. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101614"/>
      <stop offset="1" stop-color="#070B0A"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8AF0C8"/>
      <stop offset="1" stop-color="#2BD49A"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <!-- brackets: the terminal that holds the sessions -->
  <path d="M318 268 L232 268 L232 756 L318 756" fill="none" stroke="url(#mint)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M706 268 L792 268 L792 756 L706 756" fill="none" stroke="url(#mint)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- orbit: the tab ring, three sessions in flight -->
  <circle cx="512" cy="512" r="168" fill="none" stroke="#8AF0C8" stroke-width="44" stroke-dasharray="264 88 176 88" stroke-linecap="round" transform="rotate(-24 512 512)"/>
  <circle cx="512" cy="512" r="92" fill="none" stroke="#2BD49A" stroke-width="30" stroke-dasharray="150 62" stroke-linecap="round" transform="rotate(38 512 512)" opacity="0.75"/>
  <!-- the live session: core square + the agent's satellite -->
  <rect x="478" y="478" width="68" height="68" rx="14" fill="#8AF0C8"/>
  <circle cx="664" cy="404" r="34" fill="#8AF0C8"/>
</svg>
